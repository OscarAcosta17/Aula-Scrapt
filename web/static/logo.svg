<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Fondo squircle limpio y plano -->
  <rect x="32" y="32" width="448" height="448" rx="104" fill="#0d1117" />
  
  <!-- Emblema Geométrico Minimalista: Letra A + Birrete Académico + Sincronización -->
  <!-- Diamante superior (Cresta del Birrete y Ápice de la 'A') -->
